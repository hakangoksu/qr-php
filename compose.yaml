services:
  app:
    build: .
    image: qr-php:local
    env_file:
      - .env.local
    dns_opt:
      - timeout:1
      - attempts:1
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.8
    env_file:
      - .env.db.local
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db-data:
